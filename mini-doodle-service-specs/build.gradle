plugins {
    id 'java-library'
    id 'org.openapi.generator' version '7.3.0'
}

group = 'com.services'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.20'
    implementation 'org.springframework:spring-web:7.0.3'
    implementation 'org.springframework:spring-context:7.0.3'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.41'
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    api 'jakarta.validation:jakarta.validation-api:3.0.2'
}

openApiGenerate {
    generatorName = "spring"

    inputSpec = "$rootDir/mini-doodle-service-specs/openapi/openapi-v1.yaml"
    outputDir = "$buildDir/generated"

    apiPackage = "com.services.mini_doodle.api"
    modelPackage = "com.services.mini_doodle.model"

    // GLOBAL config properties
    globalProperties = [
            // Ensure models are always generated
            models          : "",
            apis            : "",

    ]

    // GENERATOR-SPECIFIC config options
    configOptions = [
            interfaceOnly           : "true",
            skipDefaultInterface    : "true",

            useSpringBoot3          : "true",
            useJakartaEe            : "true",

            // ✅ Enable Lombok
            useLombok               : "true",

            generatedConstructorWithRequiredArgs : "false",

            // ✅ Inject Builder, NoArgs, and AllArgs annotations
            // @Builder requires AllArgsConstructor.
            // Jackson often requires NoArgsConstructor.
            additionalModelTypeAnnotations: "@lombok.Builder @lombok.AllArgsConstructor",

            dateLibrary             : "java8",
            openApiNullable         : "false"
    ]
}

tasks.openApiGenerate {
    // Ensure the folder exists before IDE sync
    doFirst {
        file("$buildDir/generated/src/main/java").mkdirs()
    }
}

// ✅ Add generated sources to the main source set
sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/src/main/java"
        }
    }
}

// Make sure OpenAPI generation runs before compilation
tasks.compileJava {
    dependsOn tasks.openApiGenerate
}

// ✅ Optional: package a JAR including compiled classes
tasks.register('packageSpecs', Jar) {
    group = 'build'
    description = 'Packages mini-doodle-service-specs as a JAR including generated code.'
    archiveBaseName.set('mini-doodle-service-specs')
    from(sourceSets.main.output) // includes compiled classes from generated sources
    dependsOn tasks.compileJava
}