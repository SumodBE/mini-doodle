FetchScheduleRequest:
  type: object
  required:
    - email
    - from
    - to
  properties:
    email:
      type: string
      format: email
      example: "alice@example.com"
    from:
      type: string
      format: date-time
      description: "Start of window"
      example: "2026-02-01T09:00:00Z"
    to:
      type: string
      format: date-time
      description: "End of window"
      example: "2026-03-01T09:00:00Z"